deptrac:
  paths:
    - packages

  exclude_files:
    - '#.*/tests/.*#'
    - '#.*/vendor/.*#'

  layers:
    - name: Core
      collectors:
        - type: directory
          value: packages/nexus-core/src/.*

    - name: Runtime
      collectors:
        - type: directory
          value: packages/nexus-runtime/src/.*

    - name: App
      collectors:
        - type: directory
          value: packages/nexus-app/src/.*

    - name: Codegen
      collectors:
        - type: directory
          value: packages/nexus-codegen/src/.*

    - name: Serialization
      collectors:
        - type: directory
          value: packages/nexus-serialization/src/.*

    - name: RuntimeFiber
      collectors:
        - type: directory
          value: packages/nexus-runtime-fiber/src/.*

    - name: RuntimeSwoole
      collectors:
        - type: directory
          value: packages/nexus-runtime-swoole/src/.*

    - name: RuntimeStep
      collectors:
        - type: directory
          value: packages/nexus-runtime-step/src/.*

    - name: Psalm
      collectors:
        - type: directory
          value: packages/nexus-psalm/src/.*

    - name: Cluster
      collectors:
        - type: directory
          value: packages/nexus-cluster/src/.*

    - name: WorkerPool
      collectors:
        - type: directory
          value: packages/nexus-worker-pool/src/.*

    - name: WorkerPoolSwoole
      collectors:
        - type: directory
          value: packages/nexus-worker-pool-swoole/src/.*

    - name: Persistence
      collectors:
        - type: directory
          value: packages/nexus-persistence/src/.*

    - name: PersistenceDbal
      collectors:
        - type: directory
          value: packages/nexus-persistence-dbal/src/.*

    - name: PersistenceDoctrine
      collectors:
        - type: directory
          value: packages/nexus-persistence-doctrine/src/.*

  ruleset:
    Core:
      - Runtime
    Runtime:
      - Core
    App:
      - Core
      - Runtime
    Codegen:
      - Core
      - Runtime
    Serialization:
      - Core
    RuntimeFiber:
      - Core
      - Runtime
    RuntimeSwoole:
      - Core
      - Runtime
    RuntimeStep:
      - Core
      - Runtime
    Psalm:
      - Core
      - Serialization
      - WorkerPool
    Cluster:
      - Core
    WorkerPool:
      - Core
      - Runtime
    WorkerPoolSwoole:
      - Core
      - Runtime
      - RuntimeSwoole
      - WorkerPool
    Persistence:
      - Core
      - Serialization
    PersistenceDbal:
      - Persistence
      - Core
      - Serialization
    PersistenceDoctrine:
      - Persistence
      - PersistenceDbal
      - Core
      - Serialization
