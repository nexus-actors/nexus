deptrac:
  paths:
    - packages

  exclude_files:
    - '#.*/tests/.*#'
    - '#.*/vendor/.*#'

  layers:
    - name: Core
      collectors:
        - type: directory
          value: packages/nexus-core/src/.*

    - name: Runtime
      collectors:
        - type: directory
          value: packages/nexus-runtime/src/.*

    - name: App
      collectors:
        - type: directory
          value: packages/nexus-app/src/.*

    - name: Serialization
      collectors:
        - type: directory
          value: packages/nexus-serialization/src/.*

    - name: RuntimeFiber
      collectors:
        - type: directory
          value: packages/nexus-runtime-fiber/src/.*

    - name: RuntimeSwoole
      collectors:
        - type: directory
          value: packages/nexus-runtime-swoole/src/.*

    - name: RuntimeStep
      collectors:
        - type: directory
          value: packages/nexus-runtime-step/src/.*

    - name: Psalm
      collectors:
        - type: directory
          value: packages/nexus-psalm/src/.*

    - name: Cluster
      collectors:
        - type: directory
          value: packages/nexus-cluster/src/.*

    - name: DoctrineDbal
      collectors:
        - type: directory
          value: packages/nexus-doctrine-dbal/src/.*

    - name: DoctrineOrm
      collectors:
        - type: directory
          value: packages/nexus-doctrine-orm/src/.*

    - name: WorkerPool
      collectors:
        - type: directory
          value: packages/nexus-worker-pool/src/.*

    - name: WorkerPoolSwoole
      collectors:
        - type: directory
          value: packages/nexus-worker-pool-swoole/src/.*

    - name: Persistence
      collectors:
        - type: directory
          value: packages/nexus-persistence/src/.*

    - name: PersistenceDbal
      collectors:
        - type: directory
          value: packages/nexus-persistence-dbal/src/.*

    - name: PersistenceDoctrine
      collectors:
        - type: directory
          value: packages/nexus-persistence-doctrine/src/.*

    - name: Http
      collectors:
        - type: directory
          value: packages/nexus-http/src/.*

    - name: HttpWs
      collectors:
        - type: directory
          value: packages/nexus-http-ws/src/.*

    - name: Logger
      collectors:
        - type: directory
          value: packages/nexus-logger/src/.*

    - name: HttpServerSwoole
      collectors:
        - type: directory
          value: packages/nexus-http-server-swoole/src/.*

    - name: HttpServerSwooleThreads
      collectors:
        - type: directory
          value: packages/nexus-http-server-swoole-threads/src/.*

  ruleset:
    Core:
      - Runtime
    Runtime:
      - Core
    App:
      - Core
      - Runtime
    Serialization:
      - Core
    RuntimeFiber:
      - Core
      - Runtime
    RuntimeSwoole:
      - Core
      - Runtime
    RuntimeStep:
      - Core
      - Runtime
    Psalm:
      - Core
      - DoctrineOrm
      - Runtime
      - Serialization
      - WorkerPool
    Cluster:
      - Core
    DoctrineDbal:
      - Core
      - Http
      - Runtime
    DoctrineOrm:
      - Core
      - DoctrineDbal
      - Http
      - Runtime
    WorkerPool:
      - Core
      - Runtime
    WorkerPoolSwoole:
      - Core
      - Runtime
      - RuntimeSwoole
      - WorkerPool
    Persistence:
      - Core
      - Serialization
    PersistenceDbal:
      - Persistence
      - Core
      - Serialization
    PersistenceDoctrine:
      - Persistence
      - PersistenceDbal
      - Core
      - Serialization
    Http:
      - Core
      - Runtime
      - Serialization
    HttpWs:
      - Core
      - Http
      - Serialization
    Logger:
      - Core
    HttpServerSwoole:
      - Core
      - Http
      - HttpWs
      - Runtime
      - RuntimeSwoole
      - WorkerPool
    HttpServerSwooleThreads:
      - Core
      - Http
      - HttpServerSwoole
      - HttpWs
      - Runtime
      - RuntimeSwoole
      - WorkerPool
      - WorkerPoolSwoole
