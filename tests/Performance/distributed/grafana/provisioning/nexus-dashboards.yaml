# Grafana dashboard provider for the Nexus dashboards. otel-lgtm's built-in providers each
# point at a single file, so a mounted JSON in the provisioning dir is NOT auto-loaded; this
# provider scans a directory instead. Mounted (see compose.observability.yaml) to
# /otel-lgtm/grafana/conf/provisioning/dashboards/, pointing at the mounted dashboards dir.
apiVersion: 1

providers:
  - name: nexus
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /otel-lgtm/nexus-dashboards
      foldersFromFilesStructure: false
