# Docker-in-Docker: this compose file is the example app's own runtime.
# Independent of the parent Nexus monorepo's compose.yaml.
#
# Usage:
#   make up          # start the Swoole-Threads HTTP server on :8080
#   make perf        # run the perf client against it
#   make logs        # tail server logs
#
# In production you'd swap `app` for a deployment unit and add Postgres
# (uncomment the `db` service + flip Bootstrap to DbalEventStore).

services:
  app:
    build: .
    image: nexus-wallet-app:dev
    container_name: nexus-wallet-app
    ports:
      - "9080:8080"
    sysctls:
      net.core.somaxconn: 65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      WALLET_HTTP_HOST: "0.0.0.0"
      WALLET_HTTP_PORT: "8080"
      # Worker count — override at boot via `WALLET_THREADS=N docker compose up -d app`.
      # 4 is enough for ~42k rps at low concurrency; 8 hits ~56k at 256 clients.
      WALLET_THREADS: "${WALLET_THREADS:-4}"
      WALLET_AUTH_TOKENS: "alice-token=alice,bob-token=bob,carol-token=carol"
      # Doctrine wiring — the ledger is now a shared Postgres database
      # (one source of truth across all worker threads) instead of
      # per-worker SQLite files.
      WALLET_DB_DRIVER: "pdo_pgsql"
      WALLET_DB_HOST: "db"
      WALLET_DB_PORT: "5432"
      WALLET_DB_NAME: "wallet"
      WALLET_DB_USER: "wallet"
      WALLET_DB_PASS: "wallet"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./composer.json:/app/composer.json
      - ./vendor:/app/vendor
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./perf:/app/perf:ro
      - ./tests:/app/tests:ro
      # Path-repository source for nexus-actors/* — see composer.json.
      # When this folder is published to its own GitHub repo, remove this
      # mount and let composer resolve packages from Packagist instead.
      - ../../packages:/nexus-packages:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') ? 0 : 1);"]
      interval: 5s
      timeout: 2s
      retries: 10

  perf:
    build: .
    image: nexus-wallet-app:dev
    profiles: ["perf"]
    depends_on:
      - app
    volumes:
      - ./perf:/app/perf:ro
      - ./composer.json:/app/composer.json:ro
      - ./vendor:/app/vendor:ro
      - ../../packages:/nexus-packages:ro
    command: ["php", "perf/deposit-load.php", "http://app:8080", "alice-token", "30", "32"]

  db:
    image: postgres:16-alpine
    container_name: nexus-wallet-db
    environment:
      POSTGRES_DB: "wallet"
      POSTGRES_USER: "wallet"
      POSTGRES_PASSWORD: "wallet"
    ports:
      - "5433:5432"
    volumes:
      - wallet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  wallet-db-data:
