services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: php-swoole
        volumes:
            - ../..:/monorepo
        working_dir: /monorepo/examples/symfony-demo
        ports:
            - "8080:8080"
        environment:
            APP_DEBUG: "0"
            APP_ENV: dev
            APP_RUNTIME: Monadial\Nexus\Symfony\Runtime\NexusRuntime
            APP_RUNTIME_OPTIONS: '{"workers":1,"kernel_pool_size":20,"kernel_pool_max_pending":200}'
            APP_SECRET: dev-secret
            DATABASE_URL: mysql://app:app@mysql:3306/nexus_demo?serverVersion=8.0
            DB_POOL_SIZE: "32"
            REDIS_DSN: redis://redis:6379
        command: php -d memory_limit=2G /monorepo/examples/symfony-demo/public/index.php
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - nexus

    worker:
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: php-swoole
        volumes:
            - ../..:/monorepo
        working_dir: /monorepo/examples/symfony-demo
        environment:
            APP_DEBUG: "0"
            APP_ENV: prod
            APP_SECRET: dev-secret
            DATABASE_URL: mysql://app:app@mysql:3306/nexus_demo?serverVersion=8.0
            NEXUS_WORKER_THREADS: "4"
            REDIS_DSN: redis://redis:6379
        command: php bin/worker
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - nexus

    mysql:
        image: mysql:8.0
        command: >
            --innodb-flush-log-at-trx-commit=2
            --innodb-flush-method=O_DIRECT
            --innodb-buffer-pool-size=512M
            --innodb-log-file-size=256M
            --innodb-io-capacity=2000
            --innodb-io-capacity-max=4000
            --sync-binlog=0
            --skip-log-bin
        environment:
            MYSQL_DATABASE: nexus_demo
            MYSQL_PASSWORD: app
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: app
        healthcheck:
            interval: 5s
            retries: 10
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
            timeout: 3s
        networks:
            - nexus
        volumes:
            - mysql_data:/var/lib/mysql

    redis:
        image: redis:7-alpine
        networks:
            - nexus

networks:
    nexus:

volumes:
    mysql_data:
