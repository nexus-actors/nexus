deptrac:
  paths:
    - src

  layers:
    # ── Structural layers (DDD rings) ──────────────────────────────────────
    - name: SharedKernel
      collectors:
        - type: directory
          value: src/SharedKernel/.*

    - name: Domain
      collectors:
        - type: directory
          value: src/[A-Za-z]+/Domain/.*

    - name: Application
      collectors:
        - type: directory
          value: src/[A-Za-z]+/Application/.*

    - name: Infrastructure
      collectors:
        - type: directory
          value: src/[A-Za-z]+/Infrastructure/.*

    - name: Platform
      collectors:
        - type: directory
          value: src/Platform/(?!Actor/).*

    # PlatformActor is the shared actor-framework sublayer (src/Platform/Actor/).
    # Bounded-context Application shells may use it (like Nexus itself), but they
    # cannot reach the composition root (Boot, Bus, Http, Persistence, Serialization).
    - name: PlatformActor
      collectors:
        - type: directory
          value: src/Platform/Actor/.*

    - name: Nexus
      collectors:
        - type: classNameRegex
          value: '#^Monadial\\Nexus\\(?!Example\\Fulfillment)#'

    # ── Context layers (bounded-context fences) ────────────────────────────
    # Each context layer covers everything under that context's directory.
    # A class belongs to both its structural layer and its context layer.
    - name: OrdersCtx
      collectors:
        - type: directory
          value: src/Orders/.*

    - name: InventoryCtx
      collectors:
        - type: directory
          value: src/Inventory/.*

    - name: FulfillmentCtx
      collectors:
        - type: directory
          value: src/Fulfillment/.*

  ruleset:
    # ── Structural rules (DDD rings) ────────────────────────────────────────
    # Each structural layer also includes itself (intra-layer deps are
    # legitimate — e.g. two Domain classes in the same context) and all three
    # context layers. This last addition is required because every source file
    # simultaneously belongs to a structural layer AND a context layer, so
    # deptrac checks every (structural_source × context_target) cross-product.
    # Allowing context layers here removes those false positives; actual
    # cross-context enforcement is handled purely by the context fence below.
    # DDD ring direction is preserved: Domain does not list Application or
    # Infrastructure; Application does not list Infrastructure.
    #
    # Pure domain: PHP + SharedKernel value objects, nothing else.
    Domain: [Domain, SharedKernel, Nexus, OrdersCtx, InventoryCtx, FulfillmentCtx]
    # SharedKernel touches Nexus ONLY for the #[MessageType] attribute on
    # published contracts.
    SharedKernel: [Nexus]
    # Application may depend on PlatformActor — AggregateEntityBehavior and other
    # Platform/Actor helpers are shared application-framework utilities that
    # bounded-context Application shells legitimately use (similar to Nexus).
    # Platform (composition root) is NOT listed here — contexts must not reach Boot/Bus/Http/etc.
    Application: [Application, Domain, PlatformActor, SharedKernel, Nexus, OrdersCtx, InventoryCtx, FulfillmentCtx]
    Infrastructure: [Application, Infrastructure, Domain, SharedKernel, Nexus, OrdersCtx, InventoryCtx, FulfillmentCtx]
    # Platform is the composition root and is deliberately ungoverned at the context level:
    # it wires all contexts together. Context fences (below) apply only between bounded contexts.
    Platform: [Application, Domain, Infrastructure, Platform, PlatformActor, SharedKernel, Nexus, OrdersCtx, InventoryCtx, FulfillmentCtx]
    # PlatformActor (shared actor-framework sublayer) may only use Nexus framework types
    # and SharedKernel contracts. It must NOT reach bounded contexts or the rest of Platform.
    PlatformActor: [Nexus, SharedKernel]

    # ── Context fence rules ────────────────────────────────────────────────
    # Files belong to BOTH a structural layer and a context layer; each
    # context layer therefore also allows all structural layers to suppress
    # the (context_source × structural_target) false-positive cross-products.
    # The ONLY new enforcement here is cross-context isolation:
    # OrdersCtx and InventoryCtx do NOT list each other or FulfillmentCtx.
    #
    # Orders and Inventory are leaf contexts: no cross-context deps allowed.
    # PlatformActor (actor-framework sublayer only) allowed; Platform composition root is NOT.
    OrdersCtx: [OrdersCtx, Domain, Application, Infrastructure, PlatformActor, SharedKernel, Nexus]
    InventoryCtx: [InventoryCtx, Domain, Application, Infrastructure, PlatformActor, SharedKernel, Nexus]
    # Fulfillment/Application is the saga orchestrator: it legitimately
    # imports OrderRefFactory (Orders/Application), InventoryRefFactory
    # (Inventory/Application), and Orders domain commands CancelOrder +
    # MarkStockReserved (commands-as-contracts pattern — noted for future
    # milestone review; intentionally NOT moved to SharedKernel now).
    # PlatformActor (AggregateBehavior) allowed — same rationale as OrdersCtx/InventoryCtx.
    FulfillmentCtx: [FulfillmentCtx, OrdersCtx, InventoryCtx, Domain, Application, Infrastructure, PlatformActor, SharedKernel, Nexus]
