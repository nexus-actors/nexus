name: Benchmarks

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Build php-fiber image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: php-fiber
          load: true
          tags: nexus-php-fiber:ci
          cache-from: type=gha,scope=php-fiber

      - name: Build php-swoole image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: php-swoole
          load: true
          tags: nexus-php-swoole:ci
          cache-from: type=gha,scope=php-swoole

      - name: Install dependencies
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci
             composer install --no-interaction --no-progress

      - name: Run Fiber benchmarks
        run: docker run --rm -v "$PWD":/app -w /app
             -e BENCHMARK_JSON=/app/benchmark-results.jsonl
             nexus-php-fiber:ci
             vendor/bin/phpunit --testsuite=performance --filter=Fiber --no-progress

      - name: Run Swoole + Cluster benchmarks
        run: docker run --rm -v "$PWD":/app -w /app
             -e BENCHMARK_JSON=/app/benchmark-results.jsonl
             nexus-php-swoole:ci
             vendor/bin/phpunit --testsuite=performance --filter="Swoole|Cluster" --no-progress

      - name: Build benchmark data
        run: node scripts/update-benchmark-data.js

      - name: Commit benchmark data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/static/benchmarks/history.json
          git diff --cached --quiet || git commit -m "perf: update benchmark data [skip ci]"
          git push
