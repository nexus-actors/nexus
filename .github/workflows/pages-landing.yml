# nexusactors.com — Astro landing site deploy.
#
# Builds landing/ and deploys it to the Cloudflare Pages project
# `nexus-website`. Deploys use the `prod` environment, which holds
# CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (var).

name: pages — landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/pages-landing.yml'
  pull_request:
    paths:
      - 'landing/**'
  workflow_dispatch:

concurrency:
  group: pages-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: landing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: landing-build
          path: landing/dist
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: landing-build
          path: landing/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy landing/dist --project-name=nexus-website --branch=main
