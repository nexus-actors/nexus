# api.nexusactors.com — phpDocumentor API reference deploy.
#
# Builds with the official phpDocumentor image (3.4 — the :3 tag is currently broken upstream) (vanilla templates). The branded
# phpdoc-templates-plugin is not yet published to GitHub — once it is, swap the
# build step for the plugin image to restore the custom theme.

name: api.nexusactors.com — phpDocumentor deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/**/src/**'
      - 'phpdoc.dist.xml'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    paths:
      - 'packages/**/src/**'
      - 'phpdoc.dist.xml'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v4

      - name: Build API docs (phpDocumentor)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/data \
            -w /data \
            phpdoc/phpdoc:3.4 \
            --config=phpdoc.dist.xml --target=build/api-nexus --force

      - name: Verify output
        run: |
          test -f build/api-nexus/index.html

      - name: Deploy to Cloudflare Pages (Production)
        if: github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/api-nexus --project-name=nexus-api --branch=main

      - name: Deploy to Cloudflare Pages (Preview)
        if: github.event_name == 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/api-nexus --project-name=nexus-api --branch=pr-${{ github.event.number }}
