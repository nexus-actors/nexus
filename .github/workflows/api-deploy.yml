name: api.nexusactors.com — phpDocumentor deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/**/src/**'
      - 'phpdoc.dist.xml'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    paths:
      - 'packages/**/src/**'
      - 'phpdoc.dist.xml'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: true

