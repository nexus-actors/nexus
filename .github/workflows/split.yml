name: Split Packages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

jobs:
  split:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { local: 'nexus-app', remote: 'app' }
          - { local: 'nexus-cluster-tcp', remote: 'cluster-tcp' }
          - { local: 'nexus-cluster', remote: 'cluster' }
          - { local: 'nexus-core', remote: 'core' }
          - { local: 'nexus-doctrine-dbal', remote: 'doctrine-dbal' }
          - { local: 'nexus-doctrine-orm', remote: 'doctrine-orm' }
          - { local: 'nexus-http-auth', remote: 'http-auth' }
          - { local: 'nexus-http-server-swoole-threads', remote: 'http-server-swoole-threads' }
          - { local: 'nexus-http-server-swoole', remote: 'http-server-swoole' }
          - { local: 'nexus-http-toolkit', remote: 'http-toolkit' }
          - { local: 'nexus-http-ws', remote: 'http-ws' }
          - { local: 'nexus-http', remote: 'http' }
          - { local: 'nexus-logger', remote: 'logger' }
          - { local: 'nexus-messenger-console-swoole', remote: 'messenger-console-swoole' }
          - { local: 'nexus-messenger-console', remote: 'messenger-console' }
          - { local: 'nexus-messenger', remote: 'messenger' }
          - { local: 'nexus-observability-actor', remote: 'observability-actor' }
          - { local: 'nexus-observability-doctrine', remote: 'observability-doctrine' }
          - { local: 'nexus-observability-http', remote: 'observability-http' }
          - { local: 'nexus-observability-logger', remote: 'observability-logger' }
          - { local: 'nexus-observability-otel', remote: 'observability-otel' }
          - { local: 'nexus-observability-persistence', remote: 'observability-persistence' }
          - { local: 'nexus-observability-serialization', remote: 'observability-serialization' }
          - { local: 'nexus-observability-swoole', remote: 'observability-swoole' }
          - { local: 'nexus-observability-worker-pool', remote: 'observability-worker-pool' }
          - { local: 'nexus-observability', remote: 'observability' }
          - { local: 'nexus-persistence-dbal', remote: 'persistence-dbal' }
          - { local: 'nexus-persistence-doctrine', remote: 'persistence-doctrine' }
          - { local: 'nexus-persistence', remote: 'persistence' }
          - { local: 'nexus-psalm', remote: 'psalm' }
          - { local: 'nexus-runtime-fiber', remote: 'runtime-fiber' }
          - { local: 'nexus-runtime-step', remote: 'runtime-step' }
          - { local: 'nexus-runtime-swoole', remote: 'runtime-swoole' }
          - { local: 'nexus-runtime', remote: 'runtime' }
          - { local: 'nexus-serialization-msgpack', remote: 'serialization-msgpack' }
          - { local: 'nexus-serialization', remote: 'serialization' }
          - { local: 'nexus-worker-pool-swoole', remote: 'worker-pool-swoole' }
          - { local: 'nexus-worker-pool', remote: 'worker-pool' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install splitsh-lite
        run: |
          curl -sL https://github.com/splitsh/lite/releases/download/v1.0.1/lite_linux_amd64.tar.gz | tar xz
          sudo mv splitsh-lite /usr/local/bin/

      - name: Split and push branch
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          SHA=$(splitsh-lite --prefix=packages/${{ matrix.package.local }})
          git remote add target "https://x-access-token:${SPLIT_TOKEN}@github.com/nexus-actors/${{ matrix.package.remote }}.git"
          git push target "${SHA}:refs/heads/main" -f

      - name: Split and push tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          SHA=$(splitsh-lite --prefix=packages/${{ matrix.package.local }})
          git remote add target "https://x-access-token:${SPLIT_TOKEN}@github.com/nexus-actors/${{ matrix.package.remote }}.git" || true
          git push target "${SHA}:refs/tags/${GITHUB_REF#refs/tags/}" -f
