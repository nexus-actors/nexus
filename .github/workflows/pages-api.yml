# api.nexusactors.com — phpDocumentor API reference deploy.
#
# Builds with the official phpDocumentor image (vanilla templates; 3.4 — the
# :3 tag is currently broken upstream). Deploys use the `prod` environment,
# which holds CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (var).
# Swap the build step for the phpdoc-templates-plugin image once published.

name: pages — api

on:
  push:
    branches: [main]
    paths:
      - 'packages/**/src/**'
      - 'phpdoc.dist.xml'
      - '.github/workflows/pages-api.yml'
  pull_request:
    paths:
      - 'packages/**/src/**'
      - 'phpdoc.dist.xml'
      - '.github/workflows/pages-api.yml'
  workflow_dispatch:

concurrency:
  group: pages-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v4

      - name: Build API docs (phpDocumentor)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/data \
            -w /data \
            phpdoc/phpdoc:3.4 \
            --config=phpdoc.dist.xml --target=build/api-nexus --force

      - name: Verify output
        run: |
          test -f build/api-nexus/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs-build
          path: build/api-nexus
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-docs-build
          path: build/api-nexus

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/api-nexus --project-name=nexus-api --branch=main
