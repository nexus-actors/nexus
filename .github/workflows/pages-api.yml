# api.nexusactors.com — phpDocumentor API reference deploy.
#
# Builds with phpDocumentor from the nexus-actors/phpDocumentor fork, whose
# default template carries the Nexus branding (emerald palette, navy header,
# logo). Deploys use the `prod` environment, which holds CLOUDFLARE_API_TOKEN
# (secret) and CLOUDFLARE_ACCOUNT_ID (var).

name: pages — api

on:
  push:
    branches: [main]
    paths:
      - 'packages/**/src/**'
      - 'phpdoc.dist.xml'
      - '.github/workflows/pages-api.yml'
  pull_request:
    paths:
      - 'packages/**/src/**'
      - 'phpdoc.dist.xml'
      - '.github/workflows/pages-api.yml'
  workflow_dispatch:

concurrency:
  group: pages-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v4

      - name: Checkout phpDocumentor fork (Nexus-branded template)
        uses: actions/checkout@v4
        with:
          repository: nexus-actors/phpDocumentor
          ref: master
          path: .phpdocumentor

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install phpDocumentor
        run: composer install --no-dev --no-interaction --no-progress --working-dir=.phpdocumentor

      - name: Build API docs (phpDocumentor)
        run: php .phpdocumentor/bin/phpdoc --config=phpdoc.dist.xml --target=build/api-nexus --force

      - name: Verify output
        run: |
          test -f build/api-nexus/index.html
          grep -q nexus-logo.svg build/api-nexus/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs-build
          path: build/api-nexus
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-docs-build
          path: build/api-nexus

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/api-nexus --project-name=nexus-api --branch=main
