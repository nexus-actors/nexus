name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'website/**'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build php-fiber image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: php-fiber
          load: true
          tags: nexus-php-fiber:ci
          cache-from: type=gha,scope=php-fiber
          cache-to: type=gha,mode=max,scope=php-fiber

      - name: Build php-swoole image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: php-swoole
          load: true
          tags: nexus-php-swoole:ci
          cache-from: type=gha,scope=php-swoole
          cache-to: type=gha,mode=max,scope=php-swoole

      - name: Save Docker images
        run: |
          docker save nexus-php-fiber:ci nexus-php-swoole:ci | gzip > /tmp/docker-images.tar.gz

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/docker-images.tar.gz
          retention-days: 1

  lint:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: docker load < /tmp/docker-images.tar.gz

      - name: Install dependencies
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci composer install --no-interaction --no-progress

      - name: PHPCS
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci vendor/bin/phpcs

      - name: PHP-CS-Fixer
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction

  static-analysis:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: docker load < /tmp/docker-images.tar.gz

      - name: Install dependencies
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci composer install --no-interaction --no-progress

      - name: Psalm
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-swoole:ci vendor/bin/psalm --no-progress --find-unused-psalm-suppress

      - name: Deptrac
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-swoole:ci vendor/bin/deptrac analyse --no-progress --formatter=github-actions

      - name: Package dependency completeness
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-swoole:ci php bin/check-package-deps.php

      - name: Runtime→Core boundary fixture
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-swoole:ci php bin/verify-runtime-core-boundary.php

      - name: Cluster core→transport boundary fixture
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-swoole:ci php bin/verify-cluster-boundary.php

      - name: No Psalm suppressions
        run: |
          if grep -rn '@psalm-suppress' packages/*/src --include='*.php'; then
            echo '::error::@psalm-suppress is banned — fix the root cause instead.'
            exit 1
          fi

  unit-tests:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: docker load < /tmp/docker-images.tar.gz

      - name: Install dependencies
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci composer install --no-interaction --no-progress

      - name: Unit tests (with coverage)
        run: >
          docker run --rm -v "$PWD":/app -w /app
          -e XDEBUG_MODE=coverage
          nexus-php-fiber:ci
          vendor/bin/phpunit --testsuite=unit --colors=always
          --coverage-clover=clover.xml

      - name: Unit tests (Swoole)
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-swoole:ci vendor/bin/phpunit --testsuite=unit-swoole --colors=always

      - name: Psalm plugin tests
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci vendor/bin/phpunit --testsuite=psalm --colors=always

      - name: Coverage guard
        continue-on-error: true # TODO: write unit tests for ActorCell, Props, ActorSystem internals
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci vendor/bin/coverage-guard check clover.xml

  integration-fiber:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: docker load < /tmp/docker-images.tar.gz

      - name: Install dependencies
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci composer install --no-interaction --no-progress

      - name: Fiber integration tests
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci vendor/bin/phpunit --testsuite=integration-fiber --colors=always

      - name: Serialization integration tests
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci vendor/bin/phpunit --testsuite=integration-serialization --colors=always

      - name: Messenger integration tests
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci vendor/bin/phpunit --testsuite=integration-messenger --colors=always

      - name: Step integration tests
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci vendor/bin/phpunit --testsuite=integration-step --colors=always

      - name: Persistence integration tests
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci vendor/bin/phpunit --testsuite=integration-persistence --colors=always

      - name: Cluster TCP loopback integration tests (no ext-swoole)
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci vendor/bin/phpunit --testsuite=integration-cluster-loopback --colors=always

  integration-swoole:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: docker load < /tmp/docker-images.tar.gz

      - name: Install dependencies
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-swoole:ci composer install --no-interaction --no-progress

      - name: Swoole integration tests
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-swoole:ci vendor/bin/phpunit --testsuite=integration-swoole --colors=always

      - name: Worker Pool integration tests
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-swoole:ci vendor/bin/phpunit --testsuite=integration-workerPool --colors=always

      - name: Cluster TCP integration tests (real sockets)
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-swoole:ci vendor/bin/phpunit --testsuite=integration-cluster --colors=always

  mutation-testing:
    if: github.event_name == 'pull_request'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: docker load < /tmp/docker-images.tar.gz

      - name: Install dependencies
        run: docker run --rm -v "$PWD":/app -w /app nexus-php-fiber:ci composer install --no-interaction --no-progress

      - name: Infection mutation testing
        continue-on-error: true # infection may lag behind PHPUnit 13 support
        run: >
          docker run --rm -v "$PWD":/app -w /app
          -e XDEBUG_MODE=coverage
          nexus-php-fiber:ci
          vendor/bin/infection
          --threads=4
          --testsuite=unit
          --no-progress
          --no-interaction
          --logger-github
