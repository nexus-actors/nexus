# .github/workflows/lychee-links.yml
# Link-rot check using lychee against the built Docusaurus site.
# Runs on push/PR touching website/, weekly cron on Monday noon UTC,
# and on-demand via workflow_dispatch.
name: link-rot — lychee

on:
  push:
    branches: [main, docs/v1-launch]
    paths:
      - 'website/**'
      - '.github/workflows/lychee-links.yml'
  pull_request:
    paths:
      - 'website/**'
  schedule:
    - cron: '0 12 * * MON'   # weekly Monday noon UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install deps + build site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir lets lychee resolve root-relative links (/img/..., /docs/..., /assets/...)
          # in the built HTML against the build output; without it every such link is reported
          # unresolvable (thousands of false "provide a root dir" errors).
          # --exclude drops Docusaurus "Edit this page" links (tree/<branch>/website/docs/*.md):
          # they point at the source file on main, which 404s for a brand-new page until the PR
          # that adds it merges — a false positive on every doc-adding PR, not a broken link.
          args: --no-progress --max-concurrency 10 --exclude-loopback --exclude 'nexus-actors/nexus/tree/[^"]+/website/docs/' --root-dir "${{ github.workspace }}/website/build" "website/build/**/*.html"
          fail: true
