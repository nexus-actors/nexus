; OPcache + JIT configuration for the Nexus Swoole runtime.
;
; Tuned for a long-running Swoole process where bytecode lives in worker
; memory regardless of opcache, so the gains come from:
;   - JIT tracing of hot polymorphic dispatch (ParamResolver::resolve(),
;     middleware chains, route matching)
;   - Skipping file timestamp re-stat under load
;   - Wider polymorphic-call inlining threshold (default 2 → 4) so the
;     resolver registry's polymorphic resolve() dispatch can be inlined
;
; Documented in website/docs/http/performance.md.

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.interned_strings_buffer=16

opcache.jit=tracing
opcache.jit_buffer_size=128M
opcache.jit_hot_loop=64
opcache.jit_hot_func=127
opcache.jit_hot_return=8
opcache.jit_max_polymorphic_calls=4

zend.assertions=-1
