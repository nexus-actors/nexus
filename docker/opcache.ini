; OPcache + JIT base configuration for Nexus PHP runtimes.
;
; This file is safe for both DEV and PROD — it enables OPcache and JIT
; but keeps `validate_timestamps=1` (the default) so code edits in a
; volume-mounted dev image take effect immediately.
;
; The production-only opcache-prod.ini layered on top sets
; `validate_timestamps=0` to skip the re-stat cost — only enable that in
; immutable container images, never in the dev image.

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.save_comments=1
opcache.interned_strings_buffer=16

; Re-stat every 2 seconds in dev. Production overrides this to 0 via
; opcache-prod.ini.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

opcache.jit=tracing
opcache.jit_buffer_size=128M
opcache.jit_hot_loop=64
opcache.jit_hot_func=127
opcache.jit_hot_return=8
; Default 2 → 4 so the resolver registry's polymorphic resolve() can be
; inlined by the JIT (8 builtins, each potentially a distinct callee).
opcache.jit_max_polymorphic_calls=4

zend.assertions=-1
