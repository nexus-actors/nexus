; Production-only OPcache overrides. Layered on top of opcache.ini in the
; php-swoole image; NOT applied to the php-full dev image (xdebug + volume-
; mounted code would silently cache forever and break dev iteration).

; Never re-stat files. Container image is immutable; bytecode is hot for
; the process lifetime.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
