grumphp:
    hooks_dir: ~
    hooks_preset: local
    stop_on_failure: true
    process_timeout: 300
    git_hook_variables:
        EXEC_GRUMPHP_COMMAND: './bin/grumphp_hooks/environment_spinup && docker compose exec -T php'
    tasks:
        phpcsfixer:
            config: .php-cs-fixer.dist.php
            diff: true
            triggered_by: ['php']
        phpcs:
            standard: phpcs.xml
            triggered_by: ['php']
        psalm:
            config: psalm.xml
            triggered_by: ['php']
        phpunit:
            testsuite: unit
            always_execute: true
