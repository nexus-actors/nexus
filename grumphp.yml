grumphp:
    hooks_dir: ~
    hooks_preset: local
    stop_on_failure: true
    process_timeout: 300
    git_hook_variables:
        EXEC_GRUMPHP_COMMAND: './bin/grumphp_hooks/environment_spinup && docker compose exec -T php'
    tasks:
        phpcsfixer:
            config: .php-cs-fixer.dist.php
            diff: true
            triggered_by: ['php']
        phpcs:
            standard: phpcs.xml
            triggered_by: ['php']
            ignore_patterns:
                - '/examples/'
        psalm:
            config: psalm.xml
            triggered_by: ['php']
            ignore_patterns:
                - '/tests/'
                - '/bin/'
                - '/examples/'
                # replacement ext stubs are inputs to Psalm, not analysis targets
                - '/stubs/'
                # skeleton's App\ namespace only autoloads in full-project runs (CI)
                - '/nexus-skeleton/'
        phpunit:
            testsuite: unit
            always_execute: true
